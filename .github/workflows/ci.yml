name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Rust (primary implementation, rust/)
      - name: Install minimal stable Rust
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt && rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
      - name: Build (Rust)
        run: cargo build --locked --manifest-path rust/Cargo.toml
      - name: Test (Rust)
        run: cargo test --locked --manifest-path rust/Cargo.toml
      - name: Lint (Rust)
        run: cargo clippy --locked --all-targets --manifest-path rust/Cargo.toml -- -D warnings -W clippy::pedantic
      - name: Format (Rust)
        run: cargo fmt --manifest-path rust/Cargo.toml -- --check

      # Python baseline (requirements.txt only, no pyproject.toml, so `uv sync` does not apply)
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: requirements.txt
      - name: Install (Python)
        run: uv venv && uv pip install -r requirements.txt
      - name: Test (Python)
        run: .venv/bin/python -W error::ResourceWarning -m unittest -v
